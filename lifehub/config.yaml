name: LifeHub
version: "3.2.2"
slug: lifehub
description: Household organiser — tasks, your week, renewals, kitchen & meals and notes, with a private AI that answers questions, remembers what matters and reads your email
url: https://github.com/Shotgn16/LifeHub
# Ready-made image built by .github/workflows/addon-image.yml — HA downloads it instead of compiling.
image: "ghcr.io/shotgn16/lifehub-{arch}"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant-outline
panel_title: LifeHub
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct access from other devices (optional; uses the LifeHub login)"
backup: hot
options: {}
schema: {}
