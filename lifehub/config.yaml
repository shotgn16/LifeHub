name: LifeHub
version: "2.0.1"
slug: lifehub
description: Renewals, tasks, kitchen & meals, Bible reading, schedule and a local-AI email assistant
url: https://github.com/Shotgn16/LifeHub
# Ready-made image built by .github/workflows/addon-image.yml — HA downloads it instead of compiling.
image: "ghcr.io/shotgn16/lifehub-{arch}"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant-outline
panel_title: LifeHub
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Direct access from other devices (optional; uses the LifeHub login)"
backup: hot
options: {}
schema: {}
