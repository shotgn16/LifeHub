# XcodeGen project: run `xcodegen` in this folder to create LifeHub.xcodeproj (brew install xcodegen).
name: LifeHub
options:
  bundleIdPrefix: io.github.shotgn16
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  LifeHub:
    type: application
    platform: iOS
    sources:
      - LifeHub
      # The offline screen, shared with the Android app.
      - path: ../shared/offline.html
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shotgn16.lifehub
        PRODUCT_NAME: LifeHub
        INFOPLIST_FILE: LifeHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
