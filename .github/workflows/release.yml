name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (framework-dependent, any OS)
        run: |
          dotnet publish lifehub/src/LifeHub/LifeHub.csproj -c Release -o publish /p:UseAppHost=false
          cd publish && zip -qr ../lifehub-${GITHUB_REF_NAME}-portable.zip .
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" lifehub-${GITHUB_REF_NAME}-portable.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" lifehub-${GITHUB_REF_NAME}-portable.zip \
              --title "LifeHub ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
