name: Android app

# Builds the LifeHub Android app: an installable APK (sideload) and an AAB (Google Play).
# Download them from this run's "Artifacts". For a stable signature (so updates install over the
# old version) add the secrets described in docs/mobile-apps.md.

on:
  push:
    branches: [main]
    paths: ["mobile/android/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifehub.jks"
            echo "LIFEHUB_KEYSTORE=$RUNNER_TEMP/lifehub.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — the APK is signed with a temporary debug key (uninstall the old app before installing a newer build)."
          fi
      - name: Build APK and AAB
        working-directory: mobile/android
        env:
          LIFEHUB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFEHUB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFEHUB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LifeHub-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
