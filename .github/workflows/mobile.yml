name: Phone apps

# Builds the LifeHub phone app (.NET MAUI) for Android and iPhone/iPad from mobile/maui.
#   LifeHub-android-N:  app-release.apk (install directly) and app-release.aab (Google Play)
#   LifeHub-ios-N:      LifeHub-unsigned.ipa (sideload with Sideloadly / AltStore, or sign it yourself)
# Optional repository secrets sign the Android app with your own key (so updates install over the top):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional repository variable MS_CLIENT_ID: the Microsoft app ID for "Sign in with Microsoft".

on:
  push:
    branches: ["**"]
    paths: ["mobile/**", "lifehub/src/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: .NET MAUI for Android
        run: dotnet workload install maui-android --skip-sign-check > workload.log 2>&1 || (tail -30 workload.log; exit 1)
      - name: LifeHub's web files
        run: bash mobile/maui/copy-web.sh
      - name: Android SDK parts
        run: |
          dotnet build mobile/maui/LifeHub.Mobile/LifeHub.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android -p:TargetFrameworks=net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True > deps.log 2>&1 || (tail -40 deps.log; exit 1)
      - name: Signing key (optional)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/lifehub.jks"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/lifehub.jks -p:AndroidSigningStorePass=env:KS_PASS -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} -p:AndroidSigningKeyPass=env:KEY_PASS" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — the APK is signed with a temporary debug key (uninstall the old app before installing a newer build)."
          fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e +o pipefail
          dotnet publish mobile/maui/LifeHub.Mobile/LifeHub.Mobile.csproj -f net10.0-android -p:TargetFrameworks=net10.0-android -c Release \
            -p:ApplicationVersion=${{ github.run_number }} "-p:MicrosoftClientId=${{ vars.MS_CLIENT_ID }}" \
            ${{ steps.key.outputs.args }} -o out > build.log 2>&1
          code=$?
          grep -E "(: error|error [A-Z]+[0-9]+)" build.log | sed -E 's#(/Users|/home)/runner/work/LifeHub/LifeHub/##g; s# \[[^]]*\]$##' | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
          [ $code -eq 0 ] || { tail -60 build.log; exit $code; }
          mkdir -p dist
          cp "$(ls out/*-Signed.apk | head -1)" dist/app-release.apk
          aab=$(ls out/*-Signed.aab 2>/dev/null | head -1); [ -n "$aab" ] && cp "$aab" dist/app-release.aab
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: LifeHub-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          # The runner's default Xcode (newer ones on the image can lack their iOS platform files).
          ls -d /Applications/Xcode*.app; xcode-select -p; xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx   # the first SDK band has .NET for iOS builds for every Xcode 26.x
      - name: Use the 10.0.1xx SDK
        run: |
          v=$(dotnet --list-sdks | awk '{print $1}' | grep '^10\.0\.1' | sort -V | tail -1)
          echo "{\"sdk\":{\"version\":\"$v\",\"rollForward\":\"latestPatch\"}}" > global.json
          cat global.json; dotnet --version
      - name: .NET MAUI for iOS (matching this Xcode)
        run: |
          # The newest .NET for iOS can need a newer Xcode than GitHub's Macs have yet, so pick the newest
          # .NET for iOS made for this Xcode (or older).
          set +e +o pipefail
          xc=$(xcodebuild -version | awk 'NR==1{print $2}')
          band=$(dotnet --version | sed -E 's/^([0-9]+\.[0-9]+)\.([0-9])[0-9]*.*/\1.\200/')
          echo "::notice::Xcode $xc, .NET SDK $(dotnet --version), band $band"
          pkg="microsoft.net.sdk.ios.manifest-$band"
          curl -fsSL "https://api.nuget.org/v3-flatcontainer/$pkg/index.json" -o versions.json || echo "::warning::No version list for $pkg"
          v=$(python3 -c "
          import json
          xc=tuple(int(x) for x in '$xc'.split('.')[:2])
          try: data=json.load(open('versions.json'))['versions']
          except Exception: data=[]
          vs=[v for v in data if '-' not in v and tuple(int(x) for x in v.split('.')[:2])<=xc]
          vs.sort(key=lambda v: tuple(int(x) for x in v.split('.')))
          print(vs[-1] if vs else '')")
          echo "::notice::Xcode $xc · SDK band $band · .NET for iOS $v"
          dotnet workload config --update-mode manifests || true
          set +e
          if [ -n "$v" ]; then
            echo "{\"microsoft.net.sdk.ios\": \"$v/$band\"}" > rollback.json
            dotnet workload install maui-ios --from-rollback-file rollback.json > workload.log 2>&1
          else
            dotnet workload install maui-ios > workload.log 2>&1
          fi
          code=$?
          if [ $code -ne 0 ]; then tail -25 workload.log | while read -r l; do echo "::error::$l"; done; exit $code; fi
          dotnet workload list
      - name: LifeHub's web files
        run: bash mobile/maui/copy-web.sh
      - name: Build (unsigned)
        run: |
          set +e +o pipefail
          dotnet build mobile/maui/LifeHub.Mobile/LifeHub.Mobile.csproj -f net10.0-ios -p:TargetFrameworks=net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false -p:CodesignKey="" -p:CodesignProvision="" \
            -p:ApplicationVersion=${{ github.run_number }} "-p:MicrosoftClientId=${{ vars.MS_CLIENT_ID }}" > build.log 2>&1
          code=$?
          grep -E "(: error|error [A-Z]+[0-9]+)" build.log | sed -E 's#(/Users|/home)/runner/work/LifeHub/LifeHub/##g; s# \[[^]]*\]$##' | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
          [ $code -eq 0 ] || { tail -60 build.log; exit $code; }
          app=$(find mobile/maui/LifeHub.Mobile/bin/Release -name "*.app" -type d | head -1)
          echo "App: $app"
          mkdir -p dist/Payload && cp -R "$app" dist/Payload/
          (cd dist && zip -qr LifeHub-unsigned.ipa Payload && rm -rf Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: LifeHub-ios-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

  android-check:
    # Installs the APK on an Android emulator, opens it, goes through the first start ("Use LifeHub on this phone")
    # and checks nothing crashed. Small screenshots are in the log as "SHOT name base64-JPEG" lines.
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LifeHub-android-${{ github.run_number }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          pip install --quiet pillow
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash mobile/maui/check-android.sh apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-check-${{ github.run_number }}
          path: /tmp/phone-check
          retention-days: 7
